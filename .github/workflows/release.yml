name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            formats: nsis
            artifact: emulsion-windows
            binary: target/release/emulsion-app.exe
            binary_name: emulsion-windows.exe
          - os: macos-latest
            formats: dmg
            artifact: emulsion-macos
            binary: target/release/emulsion-app
            binary_name: emulsion-macos
          - os: ubuntu-latest
            formats: deb
            artifact: emulsion-linux
            binary: target/release/emulsion-app
            binary_name: emulsion-linux

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcb-randr0-dev libxcb-xfixes0-dev libxcb-shape0-dev libxcb-xkb-dev \
            libgl1-mesa-dev libgtk-3-dev

      - name: Test
        run: cargo test --workspace

      - name: Build (release)
        run: cargo build --release --workspace

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Package installer
        working-directory: emulsion-app
        shell: bash
        run: |
          for f in ${{ matrix.formats }}; do
            echo "::group::cargo packager --formats $f"
            cargo packager --release --formats "$f" || echo "::warning::packaging failed for $f"
            echo "::endgroup::"
          done

      - name: Collect outputs
        if: always()
        shell: bash
        run: |
          mkdir -p dist
          for ext in dmg msi deb AppImage; do
            find . -type f -name "*.${ext}" -exec cp {} dist/ \; || true
          done
          # Windows installers (NSIS .exe) live under the packager output dir;
          # restrict to *packages* so we don't grab the raw binary.
          find . -type f -path '*packages*' -name '*.exe' -exec cp {} dist/ \; || true
          if [ -f "${{ matrix.binary }}" ]; then
            cp "${{ matrix.binary }}" "dist/${{ matrix.binary_name }}"
          fi
          echo "--- dist ---"
          ls -la dist || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: warn

      - name: Attach to GitHub Release
        if: always() && (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: false
